name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: gitleaks history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config .gitleaks.toml --log-level warn

  staged-scan:
    name: pattern scan (PR diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed files for credential patterns
        run: |
          # Get files changed in this PR vs base branch
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.sha }}"

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)

          SKIP_RE='(^|/)fixtures/|\.env\.local$|\.env\.example$|package-lock\.json$|pnpm-lock\.yaml$|yarn\.lock$'

          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            'xox[baprs]-[0-9A-Za-z\-]+'
            'sk-[A-Za-z0-9]{20,}'
            'AIza[0-9A-Za-z\-_]{35}'
            'eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.'
            'NTB[0-9A-F]{30,}'
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          )

          SAFE_RE='(?i)(test|fake|example|placeholder|dummy|sample|mock|fixture|your[_-]|<[A-Z_]+>|REPLACE|TODO|CHANGEME)'

          FOUND=0
          for FILE in $CHANGED; do
            echo "$FILE" | grep -qE "$SKIP_RE" && continue
            [[ -f "$FILE" ]] || continue
            for PATTERN in "${PATTERNS[@]}"; do
              MATCHES=$(grep -nE "$PATTERN" "$FILE" | grep -vE "$SAFE_RE" || true)
              if [[ -n "$MATCHES" ]]; then
                echo "::error file=$FILE::Potential credential matched pattern '$PATTERN'"
                echo "$MATCHES"
                FOUND=1
              fi
            done
          done

          if [[ $FOUND -ne 0 ]]; then
            echo "Secret scan FAILED. Remove secrets before merging."
            exit 1
          fi
          echo "Secret scan passed."
