decisions:
  - intermediate_audit_pattern_proven: ADR-0009 §14 intermediate-audit checkpoint caught the namespace split mid-Phase-A and the wire-new-helpers gap at the Phase-B boundary. Pattern: dispatch novel-pattern work first → audit → then dispatch homogeneous work that pattern-matches. Worked. Should bake into Ch.8 (5 MCPs is 5 homogeneous workstreams — but Salesforce-Connected-App-OAuth pattern is novel; audit after that lands before the other 4 MCPs).
  - playbookid_namespace_canonical: short names (`cash_lever`, `gtm_realloc`, etc.) per ADR-0009 §3.2. Migrated 21 files in Ch.7 close. Future enum-driven dispatch must derive from PlaybookIdSchema (single source of truth) to prevent wire-new-helpers recurrence.
  - red_team_input_contract: strategic_option + restructure_decision Red-Team pass receives `{ synthesizedMemo, originalPrompt }` only — NEVER lens transcripts. B3 invariant preserved across heavy-Red-Team playbooks via RedTeam prompt {{redteam_mode}} parameterization.
  - per_playbook_countdown_table: COUNTDOWN_SECONDS table in PlanApproval.tsx codifies Phase R Decision 6 verbatim. Strategic/Restructure/Board/Cash = manual (null). GTM realloc + Pre-mortem = 30s. Open Q&A = 10s. Stakeholder 1:1 = 5s. Quick read = 0s (inline-only path normally).
  - phase_a_b_dispatch_topology: Phase A used 3 parallel (Runtime + Renderer + Tests with it.todo) → test fill-in pass → intermediate audit. Phase B used 2 parallel (Runtime + Tests; Renderer not re-invoked). Both topologies worked. Phase B test agent picked up Runtime commits mid-session and converted its own todos in-flight — smooth.

findings:
  - wire_new_helpers_anti_pattern_caught: AC-2 REOPEN saved Ch.8 from dispatching against a broken production entry point. Cost: 5 min to fix + 11 regression specs. Avoided cost: Ch.8 weeks of debugging "why is gtm_realloc returning empty memo." Lesson: every audit must check production-entry-point reachability for new helpers, not just module-level isolation.
  - single_source_of_truth_for_enum_driven_dispatch: `knownCh7Ids` was a duplicated list of strings that diverged from PlaybookIdSchema. Refactored to derive. Future chapters' enum-driven sets must follow same pattern.
  - parallel_test_dispatch_with_it_todo: writing 183 spec descriptions as it.todo against not-yet-existing modules, then converting in a follow-up pass, was cleaner than blocking test dispatch behind Runtime + Renderer. Cost: 1 extra fill-in pass. Benefit: 4 sub-agents instead of 3 in parallel.
  - sub_agent_pattern_match_against_inherited_shape: Phase B sub-agent took the cash-lever adapter shim + Phase A framework helpers as the inherited shape and produced 4 homogeneous playbooks in ~13 minutes per playbook. Strong leverage from the framework Phase A invested in.

worked:
  - intermediate_audit_at_novel_pattern_boundary: catching namespace + countdown gaps before Phase B started prevented compounding debt.
  - regression_spec_with_canonical_source_derivation: the AC-2 fix didn't just add 4 IDs — it eliminated the duplicated-list bug class by deriving from PlaybookIdSchema. The regression spec prevents recurrence.
  - sub_agent_briefs_on_disk: every Ch.7 sub-agent prompt was small (read brief at path → execute). 7 briefs total at tasks/ch7-*-brief.md. Saved ~40-60k tokens of inline-brief context across 7 dispatches.
  - design_gate_self_submit_failure_handled_inline: when Russell's form submit failed with "Failed to fetch," I wrote the APPROVED.md directly from his in-chat confirmation. Faster than debugging the local server.

