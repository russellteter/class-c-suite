  - planapproval_countdown_test_initial_design: first test pass used `act(() => vi.advanceTimersByTime(...))` synchronously. Failed because React 18 + fake timers needs `await act(async () => { await vi.advanceTimersByTimeAsync(...) })` between timer ticks. Took 2 spec iterations to land. Pattern note for future fake-timer React tests.

