decisions:
  - two_wave_with_intermediate_audit_validated: Ch.8 used same pattern as Ch.7 — Wave 1 novel (Salesforce + PowerBI + Day-Zero) → intermediate audit → Wave 2 pattern-match (Gmail + NetSuite + AWS+Chorus + Notarization). Intermediate audit caught PowerBIClient implements gap before Wave 2 compounded it. Pattern now standard for chapters with 5+ workstreams.
  - safestorage_owned_by_first_sub_agent: Salesforce sub-agent shipped safeStorage credentials infra; Gmail / Chorus / NetSuite pattern-matched it without coordination friction. Saves a coordination sub-agent.
  - lazy_electron_import_for_test_compat: buildDeps lazy-imports `electron` so non-Electron test contexts parse cleanly. Minimal-blast-radius technique for cross-context modules.
  - notarization_smoke_at_ch8_not_ch11: caught entitlements + bundle ID + cert keychain absence findings at Ch.8 entry rather than Ch.11 deadline. Russell can address Apple credentials in parallel with Ch.9/Ch.10 build instead of in crunch time.
  - day_zero_form_non_blocking: Day-Zero form ships as a parallel surface; sub-agents continue with conservative defaults. Russell answers async. Memos that consume B6/B19 sources flagged "directional pending Day-Zero confirmation" until form submits.

findings:
  - credential_hygiene_pattern_held: AC-3 greps returned zero hits across the FULL Ch.8 surface (5 services × multiple credential variants). The "first sub-agent owns the shared infra" pattern + the explicit forbidden-grep guard in every brief enforced discipline. No env-var leaks; no console.log; no plaintext writes.
  - buildDeps_wire_new_helpers_check_passed: AC-4 caught the wire-new-helpers anti-pattern preemptively. run-loop.ts:88 calls buildDeps with the correct (playbookId, db) signature; result flows into PlaybookContext.deps via the existing playbookCtx assignment. No silent regression like Ch.7's KNOWN_CH7_PLAYBOOK_IDS bug.
  - parallel_4_sub_agents_in_wave_2_with_non_overlapping_scopes: Gmail (apps/utility/src/mcp/gmail/), NetSuite (apps/utility/src/mcp/netsuite/), AWS+Chorus (apps/utility/src/mcp/{aws,chorus}/), Notarization (apps/main/build/) — zero file collisions. Each sub-agent's brief explicitly listed forbidden directories. Held.
  - powerbi_subprocess_zod_passthrough: PowerBI sub-agent correctly used Zod's passthrough on the full record but strict on lens-critical fields. account_id stays optional per intentional design (latent risk; documented). Future Ch.9+ work that consumes PowerBI must check for account_id presence before doing lens joins.

worked:
  - adr_first_then_brief_then_dispatch: Ch.8 mirrored Ch.7 — ADR codifies spec gaps; briefs reference ADR sections; sub-agent spawn prompts are tiny. Saved ~50k tokens of inline-brief context across 7 dispatches.
  - intermediate_audit_at_wave_boundary: caught implements-McpClient gap before Wave 2 pattern-matched it 4×. Cost: ~5 min. Avoided cost: 4× similar bugs in Wave 2 + final-audit REOPEN.
  - russell_action_items_compiled_in_close: every Wave 2 sub-agent surfaced 1-3 actions; close commit compiled them into one list. Easier than Russell hunting through 4 sub-agent reports.
  - electron_lazy_import: buildDeps loads electron at runtime, not import time. Tests that don't load electron still parse the file cleanly. Pattern note for any future cross-context module.

failed:
