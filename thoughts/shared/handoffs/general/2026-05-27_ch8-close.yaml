  - ipc_spec_topic_field_missed_in_ch6_audit_fix: the writeback.proposed test fixture was added to ipc.spec.ts before the topic field was added to ipc.ts (Ch.6 ADR §10.4). The fixture-update was supposed to land in Ch.6 audit-fix but only the runtime schema landed. Wave 1 audit caught it; Wave 1 audit-fix landed it. Pattern: when adding a required field to a Zod IPC variant, grep tests/unit/ for the variant's `kind:` value + update every fixture.

