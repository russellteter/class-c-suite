decisions:
  - chief_of_staff_framing_no_new_lens: Handoff agent uses Chief of Staff perspective per Phase R Decision 10d. Avoided creating a 6th lens role.
  - kebab_vault_convention_canonical: pre-mortems/ with hyphen is the vault directory convention (parseArtifact.ts:80 + data.md §Shared zone). Any future code generating origin paths must use originDirMap to translate (pre_mortem → pre-mortems).
  - ipc_handler_async_iife: ipcPort.on('message', ...) callbacks needing await are wrapped `void (async () => { ... })().catch(...)`. Pattern for cross-async IPC dispatchers.
