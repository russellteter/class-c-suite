decisions:
  - salesforce_sfdx_fallback_over_connected_app: Russell already has an authenticated SFDX CLI session against the Class org. Rather than create a dedicated Connected App, the C-Suite SalesforceClient now falls back to reading the sf CLI session (via `sf org display --json` for a fresh token, or ~/.sfdx/<user>.json directly). Vault credential still takes precedence if a Connected App is ever configured. Zero new Salesforce admin work.
  - ipc_bridge_is_load_bearing_across_chapters: the utility→main→renderer MessagePort forward (supervisor.ts port.on('message')) is the single delivery path for ALL utility-emitted IPC. It was missing entirely until Ch.10's audit. Now carries scheduler + writeback + handoff variants.
  - phase2_close_at_concern_close_acceptable: 4 of 5 build chapters (6/8/9/10) closed CONCERN-CLOSE, Ch.7 PASS. The CONCERNs are all non-blocking known-followups (live-data verification, Day-Zero defaults, AWS preflight). Consistent with the auto-mode decide-and-log doctrine. Phase 2 emits COMPLETE; Ch.11 on-Mac gate is the real acceptance.

worked:
  - independent_re_verification_via_sendmessage: rather than self-certify the AC-2 fix at the Phase 2 close gate, resumed the same audit agent via SendMessage for a focused bridge re-check (~45s, 5 tool calls). Cheaper than a fresh audit, more rigorous than a self-note. Pattern for close-gate fixes.
  - two_wave_and_single_audit_sizing: Ch.10 (one feature surface) used 2 parallel sub-agents + 1 final audit — right-sized. Ch.7/Ch.8 (N independent surfaces) needed intermediate audits. Match audit cadence to fan-out width.
  - credential_staging_in_idle_time: while Ch.10 agents ran, staged 4 of 7 integration credentials. Classifier blocked cross-app credential reads (Claude Desktop config, Contact Enrichment secrets) even with user authorization — standalone scripts handed to Russell instead.

