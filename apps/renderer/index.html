<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C-Suite</title>
    <style>
      :root {
        --color-navy-900: #0a1849;
        --color-navy-700: #182a6b;
        --color-navy-500: #2a3f8a;
        --color-gold-500: #c9a14b;
        --color-purple-500: #4739e7;
        --color-purple-400: #6a5cf0;
        --color-text-primary: #f5f3ff;
        --color-text-secondary: #b8b4d6;
        --color-text-muted: #6b6788;
        --color-surface-1: rgba(255, 255, 255, 0.04);
        --color-surface-2: rgba(255, 255, 255, 0.07);
        --color-border: rgba(255, 255, 255, 0.12);
        --font-sans: -apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: var(--font-sans);
        background: var(--color-navy-900);
        color: var(--color-text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        line-height: 1.5;
      }
      .scaffold {
        max-width: 520px;
        padding: 32px;
        background: var(--color-surface-1);
        border: 1px solid var(--color-border);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 23px;
        color: var(--color-text-primary);
        font-weight: 600;
      }
      .sub {
        color: var(--color-text-secondary);
        margin: 0 0 24px 0;
        font-size: 13px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--color-border);
        font-size: 13px;
      }
      .row:last-child { border-bottom: none; }
      .row .k { color: var(--color-text-muted); }
      .row .v { color: var(--color-text-secondary); font-family: 'SF Mono', ui-monospace, monospace; }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        background: var(--color-purple-500);
        color: var(--color-text-primary);
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div class="scaffold">
      <h1>C-Suite <span class="tag">Ch.6 scaffold</span></h1>
      <p class="sub">Renderer scaffold. Full UI lands when Ch.7 wires Vite + the screens this Ch.6 build is rendering.</p>
      <div class="row"><span class="k">Process</span><span class="v">renderer</span></div>
      <div class="row"><span class="k">CSP</span><span class="v">strict (no eval; no remote)</span></div>
      <div class="row"><span class="k">Context isolation</span><span class="v">on</span></div>
      <div class="row"><span class="k">Sandbox</span><span class="v">on</span></div>
      <div class="row"><span class="k">Build</span><span class="v">main + utility forked from main</span></div>
    </div>
    <script>
      // Sanity: confirm preload's contextBridge surface is reachable if wired.
      window.addEventListener('DOMContentLoaded', () => {
        if (typeof window.csuite !== 'undefined') {
          console.log('[renderer] preload bridge available:', Object.keys(window.csuite));
        } else {
          console.log('[renderer] preload bridge not yet wired (expected at Ch.6 scaffold)');
        }
      });
    </script>
  </body>
</html>
